<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Alterar senha</ui:define>

    <ui:define name="conteudo">
        <div class="cartao">
            <h2>Alterar senha</h2>

            <h:form id="form">
                <h:panelGrid columns="3" styleClass="formulario">
                    <h:outputLabel for="atual" value="Senha atual *"/>
                    <h:inputSecret id="atual" value="#{senhaController.senhaAtual}" maxlength="72"
                                   required="true" requiredMessage="Informe a senha atual"/>
                    <h:message for="atual" styleClass="campo-erro"/>

                    <h:outputLabel for="nova" value="Nova senha *"/>
                    <h:inputSecret id="nova" value="#{senhaController.novaSenha}" maxlength="72"
                                   required="true" requiredMessage="Informe a nova senha"/>
                    <h:message for="nova" styleClass="campo-erro"/>

                    <h:outputLabel for="confirmacao" value="Confirmar nova senha *"/>
                    <h:inputSecret id="confirmacao" value="#{senhaController.confirmacao}" maxlength="72"
                                   required="true" requiredMessage="Confirme a nova senha"/>
                    <h:message for="confirmacao" styleClass="campo-erro"/>
                </h:panelGrid>

                <p class="dica">A nova senha deve ter pelo menos 8 caracteres.</p>

                <h:commandButton value="Alterar senha" action="#{senhaController.alterar}"/>
                <h:link value="Cancelar" outcome="/index" styleClass="botao botao-cinza"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
