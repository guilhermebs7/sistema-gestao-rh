<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Funcionários</ui:define>

    <ui:define name="conteudo">
        <div class="cartao">
            <h2>Funcionários</h2>

            <h:link value="Novo funcionário" outcome="form" styleClass="botao"/>

            <h:form id="formLista">
                <div class="busca">
                    <h:inputText id="termo" value="#{funcionarioController.termoBusca}"
                                 pt:placeholder="Buscar por nome, CPF ou matrícula"/>
                    <h:commandButton value="Pesquisar" action="#{funcionarioController.pesquisar}"/>
                    <!-- Link simples: recarrega a página do zero e limpa a busca -->
                    <h:link value="Limpar" outcome="lista" styleClass="botao botao-cinza"/>
                </div>

                <h:outputText rendered="#{not empty funcionarioController.funcionarios}"
                              styleClass="dica"
                              value="#{funcionarioController.funcionarios.size()} funcionário(s) encontrado(s)"/>

                <h:dataTable value="#{funcionarioController.funcionarios}" var="func"
                             styleClass="tabela"
                             rendered="#{not empty funcionarioController.funcionarios}">
                    <h:column>
                        <f:facet name="header">Matrícula</f:facet>
                        <h:outputText value="#{func.matricula}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Nome</f:facet>
                        <h:outputText value="#{func.nome}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">CPF</f:facet>
                        <h:outputText value="#{func.cpf}" converter="digitosConverter"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Departamento</f:facet>
                        <h:outputText value="#{func.departamento.nome}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Cargo</f:facet>
                        <h:outputText value="#{func.cargo.nome}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Situação</f:facet>
                        <h:outputText value="#{func.situacao.descricao}"
                                      styleClass="#{func.situacao.name() eq 'ATIVO' ? 'selo selo-ativo' : 'selo selo-inativo'}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Ações</f:facet>
                        <span class="acoes">
                            <h:link value="Ver" outcome="detalhe">
                                <f:param name="id" value="#{func.id}"/>
                            </h:link>
                            <h:link value="Editar" outcome="form">
                                <f:param name="id" value="#{func.id}"/>
                            </h:link>
                            <h:commandLink value="Inativar" styleClass="excluir"
                                           rendered="#{func.situacao.name() eq 'ATIVO'}"
                                           action="#{funcionarioController.inativar(func)}"
                                           onclick="return confirm('Confirma a inativação deste funcionário?');"/>
                            <h:commandLink value="Reativar"
                                           rendered="#{func.situacao.name() eq 'INATIVO'}"
                                           action="#{funcionarioController.reativar(func)}"
                                           onclick="return confirm('Confirma a reativação deste funcionário?');"/>
                        </span>
                    </h:column>
                </h:dataTable>
            </h:form>

            <h:outputText value="Nenhum funcionário encontrado."
                          rendered="#{empty funcionarioController.funcionarios}"/>
        </div>
    </ui:define>
</ui:composition>
