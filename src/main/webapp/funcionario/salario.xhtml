<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Atualizar salário</ui:define>

    <ui:define name="conteudo">
        <div class="cartao">
            <h2>Atualizar salário</h2>

            <h:form id="form">

                <!-- ============ DADOS ATUAIS (somente leitura) ============ -->
                <fieldset class="grupo">
                    <legend>Dados atuais</legend>
                    <h:panelGrid columns="2" styleClass="formulario">

                        <h:outputLabel for="funcionario" value="Funcionário"/>
                        <h:inputText id="funcionario"
                                     value="#{salarioController.funcionario.nome} (#{salarioController.funcionario.matricula})"
                                     readonly="true"/>

                        <h:outputLabel for="cargo" value="Cargo"/>
                        <h:inputText id="cargo"
                                     value="#{salarioController.funcionario.cargo.nome}"
                                     readonly="true"/>

                        <h:outputLabel for="salarioAtual" value="Salário atual"/>
                        <h:inputText id="salarioAtual"
                                     value="#{salarioController.funcionario.salarioAtual}"
                                     readonly="true">
                            <f:convertNumber type="currency" currencySymbol="R$"/>
                        </h:inputText>
                    </h:panelGrid>
                </fieldset>

                <!-- ============ NOVO SALÁRIO (editável) ============ -->
                <fieldset class="grupo">
                    <legend>Novo salário</legend>
                    <h:panelGrid columns="3" styleClass="formulario">

                        <h:outputLabel for="novoSalario" value="Novo salário (R$) *"/>
                        <h:inputText id="novoSalario" value="#{salarioController.novoSalario}"
                                     required="true" requiredMessage="Informe o novo salário"
                                     converterMessage="Valor inválido. Exemplo: 5200,00">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                        </h:inputText>
                        <h:message for="novoSalario" styleClass="campo-erro"/>

                        <h:outputLabel for="motivo" value="Motivo *"/>
                        <h:inputText id="motivo" value="#{salarioController.motivo}"
                                     maxlength="255" required="true"
                                     requiredMessage="O motivo é obrigatório"/>
                        <h:message for="motivo" styleClass="campo-erro"/>
                    </h:panelGrid>
                </fieldset>

                <div class="botoes">
                    <h:commandButton value="Confirmar reajuste" action="#{salarioController.salvar}"/>
                    <h:link value="Cancelar" outcome="detalhe" styleClass="botao botao-cinza"
                            rendered="#{not empty salarioController.funcionario}">
                        <f:param name="id" value="#{salarioController.funcionario.id}"/>
                    </h:link>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
