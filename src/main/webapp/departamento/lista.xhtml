<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Departamentos</ui:define>

    <ui:define name="conteudo">
        <div class="cartao">
            <h2>Departamentos</h2>

            <h:link value="Novo departamento" outcome="form" styleClass="botao"/>

            <!-- Botões de ação precisam estar dentro de um h:form -->
            <h:form>
                <h:dataTable value="#{departamentoController.departamentos}" var="d"
                             styleClass="tabela" rendered="#{not empty departamentoController.departamentos}">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        <h:outputText value="#{d.id}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Nome</f:facet>
                        <h:outputText value="#{d.nome}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Descrição</f:facet>
                        <h:outputText value="#{d.descricao}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Ações</f:facet>
                        <span class="acoes">
                            <h:link value="Editar" outcome="form">
                                <f:param name="id" value="#{d.id}"/>
                            </h:link>
                            <h:commandLink value="Excluir" styleClass="excluir"
                                           action="#{departamentoController.excluir(d)}"
                                           onclick="return confirm('Excluir o departamento #{d.nome}?');"/>
                        </span>
                    </h:column>
                </h:dataTable>
            </h:form>

            <h:outputText value="Nenhum departamento cadastrado."
                          rendered="#{empty departamentoController.departamentos}"/>
        </div>
    </ui:define>
</ui:composition>
