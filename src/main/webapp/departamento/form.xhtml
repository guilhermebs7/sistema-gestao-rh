<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Departamento</ui:define>



    <ui:define name="conteudo">
        <div class="cartao">
            <h2>#{empty departamentoController.departamento.id ? 'Novo departamento' : 'Editar departamento'}</h2>

            <h:form id="form">
                <h:panelGrid columns="3" styleClass="formulario">
                    <h:outputLabel for="nome" value="Nome *"/>
                    <h:inputText id="nome" value="#{departamentoController.departamento.nome}"
                                 maxlength="100" required="true"
                                 requiredMessage="O nome é obrigatório"/>
                    <h:message for="nome" styleClass="campo-erro"/>

                    <h:outputLabel for="descricao" value="Descrição"/>
                    <h:inputTextarea id="descricao" value="#{departamentoController.departamento.descricao}"
                                     rows="3"/>
                    <h:message for="descricao" styleClass="campo-erro"/>
                </h:panelGrid>

                <br/>
                <h:commandButton value="Salvar" action="#{departamentoController.salvar}"/>
                <h:link value="Cancelar" outcome="lista" styleClass="botao botao-cinza"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
