<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="titulo">Cargos</ui:define>

    <ui:define name="conteudo">
        <div class="cartao">
            <h2>Cargos</h2>

            <h:link value="Novo cargo" outcome="form" styleClass="botao"/>

            <h:form>
                <h:dataTable value="#{cargoController.cargos}" var="c"
                             styleClass="tabela" rendered="#{not empty cargoController.cargos}">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        <h:outputText value="#{c.id}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Nome</f:facet>
                        <h:outputText value="#{c.nome}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Descrição</f:facet>
                        <h:outputText value="#{c.descricao}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Salário-base</f:facet>
                        <h:outputText value="#{c.salarioBase}">
                            <f:convertNumber type="currency" currencySymbol="R$"/>
                        </h:outputText>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Ações</f:facet>
                        <span class="acoes">
                            <h:link value="Editar" outcome="form">
                                <f:param name="id" value="#{c.id}"/>
                            </h:link>
                            <h:commandLink value="Excluir" styleClass="excluir"
                                           action="#{cargoController.excluir(c)}"
                                           onclick="return confirm('Excluir o cargo #{c.nome}?');"/>
                        </span>
                    </h:column>
                </h:dataTable>
            </h:form>

            <h:outputText value="Nenhum cargo cadastrado."
                          rendered="#{empty cargoController.cargos}"/>
        </div>
    </ui:define>
</ui:composition>
