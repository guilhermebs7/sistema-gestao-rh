<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<!-- Espaço onde as páginas declaram parâmetros de URL (f:viewParam / f:viewAction) -->
<f:metadata>
    <ui:insert name="metadata"/>
</f:metadata>

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title><ui:insert name="titulo">Início</ui:insert> - Gestão de RH</title>
    <h:outputStylesheet library="css" name="estilo.css"/>
</h:head>

<h:body>
    <header>
        <h1>Sistema de Gestão de Funcionários</h1>
    </header>

    <nav>
        <h:link value="Início" outcome="/index"/>
        <h:link value="Departamentos" outcome="/departamento/lista"/>
        <h:link value="Cargos" outcome="/cargo/lista"/>
    </nav>

    <main>
        <!-- Mensagens globais (sucesso e erros de regra de negócio) -->
        <h:messages globalOnly="true" layout="list" styleClass="mensagens"
                    infoClass="msg-info" errorClass="msg-erro"/>

        <ui:insert name="conteudo">Conteúdo da página</ui:insert>
    </main>

    <footer>Gestão de RH &#169; 2026</footer>
</h:body>
</html>

        <!-- Template define a moldura (cabeçalho, menu, rodape) uma unica vez  -->
