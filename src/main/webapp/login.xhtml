<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Entrar - Gestão de RH</title>
    <h:outputStylesheet library="css" name="estilo.css"/>
    <h:outputStylesheet library="css" name="login.css"/>
</h:head>

<h:body styleClass="pagina-login">
    <div class="caixa-login">
        <h1>Gestão de RH - STI</h1>
        <p class="subtitulo">Acesse com o usuário administrador</p>

        <h:messages globalOnly="true" layout="list" styleClass="mensagens"
                    infoClass="msg-info" errorClass="msg-erro"/>

        <h:form id="form">
            <h:outputLabel for="login" value="Login"/>
            <h:inputText id="login" value="#{loginController.login}" maxlength="50"
                         required="true" requiredMessage="Informe o login"/>
            <h:message for="login" styleClass="campo-erro"/>

            <h:outputLabel for="senha" value="Senha"/>
            <h:inputSecret id="senha" value="#{loginController.senha}" maxlength="72"
                           required="true" requiredMessage="Informe a senha"/>
            <h:message for="senha" styleClass="campo-erro"/>

            <h:commandButton value="Entrar" action="#{loginController.entrar}"/>
        </h:form>
    </div>
</h:body>
</html>
